spring:
  application:
    name: feedback-systems-playground
  datasource:
    url: ${FSP_DB_URL:jdbc:postgresql://localhost:5432/fsp}
    username: ${FSP_DB_USER:fsp}
    password: ${FSP_DB_PASSWORD:fsp}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${FSP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

fsp:
  runs:
    # How often a running simulation flushes samples and log lines to Postgres.
    flush-interval-ticks: 25
    flush-interval-millis: 500
    # Ceiling on how fast a run may be asked to go; "max" speed means unthrottled.
    max-ticks-per-second: 2000
    # Runs left running when the process stopped come back paused at their last checkpoint.
    recover-on-startup: true
  metrics:
    # Rollup bucket size used when a chart asks for a coarser resolution than raw ticks.
    rollup-bucket-ticks: 50
    rollup-enabled: true

logging:
  level:
    dev.fsp: INFO
